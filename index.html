<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>图像质量分析平台</title>

  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
  <header class="site-header">
    <div class="page-container">
      <h1>图像质量分析平台</h1>
      <p>选择算法 → 上传图像 → 选取 ROI → 输出测试结果</p>
    </div>
  </header>

  <main class="page-container">
    <section class="algorithm-section">
      <div class="section-heading">
        <div>
          <h2>选择分析模型</h2>
          <p>页面只管理流程和展示；每个模型的计算逻辑放在独立 JavaScript 文件中。</p>
        </div>
      </div>

      <div class="algorithm-grid" id="algorithmGrid">
        <button class="algorithm-card" data-algorithm="slantedEdge" type="button">
          <span class="algorithm-icon">╱</span>
          <strong>斜边</strong>
          <small>ESF · LSF · MTF</small>
        </button>

        <button class="algorithm-card" data-algorithm="siemensStar" type="button">
          <span class="algorithm-icon">✺</span>
          <strong>星图</strong>
          <small>径向 MTF · 分辨率</small>
        </button>

        <button class="algorithm-card" data-algorithm="deadLeaves" type="button">
          <span class="algorithm-icon">◌</span>
          <strong>枯叶图</strong>
          <small>纹理 · 降噪 · 锐化</small>
        </button>

        <button class="algorithm-card" data-algorithm="linePairs" type="button">
          <span class="algorithm-icon">▥</span>
          <strong>线对</strong>
          <small>分辨率 · 对比度</small>
        </button>

        <button class="algorithm-card" data-algorithm="colorChecker" type="button">
          <span class="algorithm-icon">▦</span>
          <strong>24 色卡</strong>
          <small>色差 · 白平衡 · 饱和度</small>
        </button>

        <button class="algorithm-card" data-algorithm="grayScale" type="button">
          <span class="algorithm-icon">▤</span>
          <strong>灰阶</strong>
          <small>Gamma · 动态范围</small>
        </button>

        <button class="algorithm-card" data-algorithm="checkerboard" type="button">
          <span class="algorithm-icon">▦</span>
          <strong>棋盘格</strong>
          <small>畸变 · 标定 · 角点</small>
        </button>

        <button class="algorithm-card" data-algorithm="uniformity" type="button">
          <span class="algorithm-icon">▧</span>
          <strong>均匀性</strong>
          <small>亮度 · 色彩 · 暗角</small>
        </button>
      </div>
    </section>

    <section class="workspace hidden" id="workspace">
      <div class="workspace-header">
        <div>
          <h2 id="algorithmTitle">分析工作区</h2>
          <p id="algorithmDescription">请选择一个分析模型。</p>
        </div>

        <button id="backButton" class="button button-secondary" type="button">
          返回模型列表
        </button>
      </div>

      <section class="panel">
        <div class="toolbar">
          <input id="imageInput" type="file" accept="image/*" />

          <button id="clearRoiButton" class="button button-secondary" type="button" disabled>
            清除 ROI
          </button>

          <button id="analyzeButton" class="button" type="button" disabled>
            开始分析
          </button>
        </div>
      </section>

      <section class="workspace-grid">
        <div class="panel">
          <h3>图片与 ROI</h3>
          <p class="hint" id="roiHint">
            上传图片后，用鼠标拖动框选分析区域。
          </p>

          <div class="canvas-wrapper">
            <canvas id="imageCanvas"></canvas>
          </div>
        </div>

        <aside class="panel">
          <h3>分析状态</h3>
          <div class="status-box" id="statusBox">
            请选择模型并上传图片。
          </div>

          <h3 class="output-heading">预期输出</h3>
          <div class="output-list" id="expectedOutputs"></div>
        </aside>
      </section>

      <section class="panel">
        <h3>结果区域</h3>

        <div id="resultContainer" class="result-container">
          <p class="empty-text">选择模型、上传图像并框选 ROI 后，分析结果将在此显示。</p>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
